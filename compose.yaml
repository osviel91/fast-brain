services:
  fast-brain:
    image: ghcr.io/osviel91/fast-brain:latest
    build: .
    environment:
      FAST_BRAIN_API_KEY: ${FAST_BRAIN_API_KEY}
      DATABASE_URL: ${DATABASE_URL:-postgresql://fastbrain:fastbrain@postgres:5432/fastbrain}
      EMBEDDINGS_BASE_URL: ${EMBEDDINGS_BASE_URL}
      EMBEDDINGS_API_KEY: ${EMBEDDINGS_API_KEY}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL}
      EMBEDDINGS_DIMENSIONS: ${EMBEDDINGS_DIMENSIONS:-1536}
      SUMMARIZER_BASE_URL: ${SUMMARIZER_BASE_URL:-}
      SUMMARIZER_API_KEY: ${SUMMARIZER_API_KEY:-}
      SUMMARIZER_MODEL: ${SUMMARIZER_MODEL:-}
    ports:
      - "8088:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: fastbrain
      POSTGRES_USER: fastbrain
      POSTGRES_PASSWORD: fastbrain
    volumes:
      - fastbrain_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastbrain -d fastbrain"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  fastbrain_postgres:
