[project]
name = "fast-brain"
version = "0.1.0"
description = "External semantic memory for Hermes agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.0",
    "httpx>=0.28.0",
    "pgvector>=0.4.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.10.0",
    "uvicorn[standard]>=0.35.0",
]

[project.scripts]
fast-brain = "fast_brain.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
